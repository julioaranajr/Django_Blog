<!-- Navbar -->
{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container">
    <a class="navbar-brand" href="{% url 'homepage' %}">
      <img
        src="/media/brand/django-logo.svg"
        alt="Django Blog"
        width="75"
        height="auto"
        class="d-inline-block align-text-top"
      />
      Blog
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navbarToggle"
      aria-controls="navbarToggle"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarToggle">
      <div class="navbar-nav mr-auto">
        <a class="nav-item nav-link" href="{% url 'blog:home-blog' %}">Post</a>
        <a class="nav-item nav-link" href="{% url 'blog:about-blog' %}"
          >About</a
        >
      </div>
      <!-- Navbar Right Side -->
      <div class="navbar-nav">
        {% if user.is_authenticated %}
        <a class="nav-item nav-link" href="{% url 'blog:post-create' %}"
          >New Post</a
        >
        <a class="nav-item nav-link" href="{% url 'accounts:profile' %}"
          >Profile</a
        >
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="btn btn-dark" type="submit">Log Out</button>
        </form>
        {% else %}
        <a class="nav-item nav-link" href="{% url 'accounts:login' %}">Login</a>
        <a class="nav-item nav-link" href="{% url 'accounts:register' %}"
          >Register</a
        >
        {% endif %}
      </div>
    </div>
      <form class="d-flex">
        <input
          class="form-control me-2"
          type="search"
          placeholder="Search"
          aria-label="Search"
        />
        <button class="btn btn-secondary" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
<!-- Navbar -->
