{% extends "base.html" %}
{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <legend class="border-bottom mb-1">Delete Post</legend>
            <br>
            <br>
            <h3>Are you sure you want to delete the post?</h3>
            <br>
            <h2> "{{ object.title }}" </h2>
        </fieldset>
        <br>
        <div class="form-group">
            <button class="btn btn-danger" type="submit">Yes, Delete</button>
            <a class="btn btn-secondary" href="{% url 'blog:post-detail' object.id %}">Cancel</a>
        </div>
    </form>
    <br>
</div>
<br>
{% endblock content %}
